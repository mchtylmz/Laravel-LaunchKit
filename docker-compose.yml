services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-launchkit-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel_launchkit
      DB_USERNAME: launchkit
      DB_PASSWORD: secret
      REDIS_HOST: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      - mysql
      - redis
      - mailpit

  node:
    image: node:22-alpine
    container_name: laravel-launchkit-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "npm install && npm run build"

  mysql:
    image: mysql:8.4
    container_name: laravel-launchkit-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel_launchkit
      MYSQL_USER: launchkit
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: laravel-launchkit-redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: laravel-launchkit-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
